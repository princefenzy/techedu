<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nike Air Max 90</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="classpratical.css">
</head>
<body>
<div class="page">

    <nav class="navbar">
        <img class="nikelogo" src="images/nike logo.png" alt="Nike logo">

        <div class="navlinks">
            <a href="#MEN">MEN</a>
            <a href="#WOMEN">WOMEN</a>
            <a href="#KIDS">KIDS</a>
            <a href="#SKNRS">SKNRS</a>
        </div>

        <div class="navactions">
            <label class="searchbox">
                <svg viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="3" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6-6"/></svg>
                <input type="search" placeholder="Search">
            </label>
            <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="2"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>
            <svg class="navicon" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"><path d="M3 4h3l2.5 11h10L21 7H7"/><circle cx="9.5" cy="20" r="1.5"/><circle cx="17.5" cy="20" r="1.5"/></svg>
        </div>
    </nav>

    <h2 class="background-text">NIKE</h2>
    <span class="vertical-text">JUST DO IT</span>

    <!-- Put ANY shoe photo here (a local file or a link) -->
    <div class="shoe-frame">
        <img class="shoe-image" src="https://images.unsplash.com/photo-1712168332222-c1996322f935?w=800&auto=format&fit=crop&q=60" alt="Nike Air Max 90">
    </div>

    <div class="details">
        <h1>Nike Air Max 90</h1>
        <p class="description">
            Whether you want a monochromatic look or sporty with an edge,
            the AM90 can do it all. Customise everything from the laces to
            the Nike Air unit for a design that is truly you.
        </p>

        <p class="sizetitle">Select Size</p>
        <div class="sizes">
            <button>UK 7</button>
            <button>UK 8</button>
            <button>UK 9</button>
        </div>

        <h3 class="price">MRP: ₹14999/-</h3>

        <div class="purchase">
            <button class="cartbutton">Add to Cart</button>
            <svg class="heart" viewBox="0 0 24 24" fill="none" stroke="#1e1e1e" stroke-width="1.8"><path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/></svg>
        </div>
    </div>

    <div class="big-swoosh">
        <svg viewBox="0 0 600 200" fill="#1e1e1e" xmlns="http://www.w3.org/2000/svg">
            <path d="M0 200C-10 150 40 120 110 150 200 185 330 120 600 0 400 130 250 200 130 235 60 250 5 240 0 200z"/>
        </svg>
    </div>

</div>
</body>
</html>
